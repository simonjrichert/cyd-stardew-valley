; Cheap Yellow Display (ESP32-2432S028R) — ILI9341 + XPT2046
; Pins are injected here so TFT_eSPI's library copy of User_Setup.h is never edited.
; If the panel stays white on your board revision, change TFT_RST to -1
; (those boards tie reset to EN) and rebuild.

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 57600
; The CYD resets when COM opens, so enter download mode during "Connecting...".
; 57600 avoids the corrupted stub packet this board hit at higher speeds.
upload_flags =
    --connect-attempts=30
    --before=default_reset
    --after=hard_reset
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD=1
    -DSUPPORT_TRANSACTIONS=1
